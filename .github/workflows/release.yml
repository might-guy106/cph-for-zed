name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  helper:
    strategy:
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
          - os: macos-13
            target: x86_64-apple-darwin
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - run: cargo build --release -p cph-helper --target ${{ matrix.target }}

      - name: package binary
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/cph-helper" dist/
          tar -czf "cph-helper-${{ matrix.target }}.tar.gz" -C dist cph-helper

      - name: upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: cph-helper-${{ matrix.target }}.tar.gz
